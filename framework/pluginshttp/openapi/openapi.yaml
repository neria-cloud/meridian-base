    # ---- ConfigMarshallerPlugin ----
    ConfigMapRequest:
      $ref: './schemas/config.yaml#/ConfigMapRequest'
    ConfigMapResponse:
      $ref: './schemas/config.yaml#/ConfigMapResponse'

    # ---- HookStream ----
    HookStreamRequest:
      $ref: './schemas/hook-stream.yaml#/HookStreamRequest'
    HookStreamResponse:
      $ref: './schemas/hook-stream.yaml#/HookStreamResponse'
